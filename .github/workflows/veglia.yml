# Guardia dei commenti: il cron di GitHub qui non parte in modo affidabile, quindi questo workflow
# fa girare il motore ogni 10 minuti per circa 5 ore e 20 minuti (sotto il limite di 350 minuti), poi si riavvia da solo.
# commenti.yml resta come riserva e per i giri a mano.
name: veglia

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: veglia
  cancel-in-progress: false

jobs:
  veglia:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      IG_TOKEN: ${{ secrets.IG_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      STRIPE_KEY: ${{ secrets.STRIPE_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Motore ogni 10 minuti
        run: |
          git config user.name "zampe-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for giro in $(seq 1 32); do
            git pull -q --rebase -X theirs || { git rebase --abort 2>/dev/null; git reset -q --hard origin/main; }
            python3 -I motore/commenti.py || echo "giro $giro: errore del motore, riprovo al prossimo"
            python3 -I motore/messaggi.py || echo "giro $giro: errore nei messaggi, riprovo al prossimo"
            formato=$(python3 -I motore/orari.py || true)
            if [ -n "$formato" ]; then echo "giro $giro: è l'ora del reel $formato"; prova=false; [ "${formato#*:}" = prova ] && prova=true; formato=${formato%%:*}
              for t in 1 2 3; do gh workflow run reel.yml -f formato="$formato" -f prova=$prova && break; sleep 20; [ $t = 3 ] && { echo "reel non avviato, riprovo al prossimo giro"; python3 -I motore/orari.py --annulla; }; done; fi
            git add docs/data/animali.json motore/stato.json motore/reel_fatti.json motore/messaggi.json motore/pubblicati.json docs/cartoline
            if ! git diff --cached --quiet; then
              git commit -q -m "Mappa aggiornata dai commenti"
              git pull -q --rebase -X theirs && git push -q || { git rebase --abort 2>/dev/null; echo "giro $giro: push non riuscito, riprovo al prossimo"; }
            fi
            if [ "$giro" -lt 32 ]; then sleep 600; fi
          done
      - name: Riparti
        if: always()
        run: |
          # un errore di GitHub qui fermerebbe tutto: si riprova, e il custode (custode.yml) fa da rete
          for t in 1 2 3 4 5; do gh workflow run veglia.yml --ref main && exit 0; sleep 30; done
          exit 1

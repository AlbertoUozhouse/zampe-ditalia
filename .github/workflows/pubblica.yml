# Pubblicazione manuale (o chiamata da altri workflow) di un post, reel o storia già presente nel sito.
name: pubblica

on:
  workflow_dispatch:
    inputs:
      tipo:
        description: "IMAGE, REELS o STORIES"
        required: true
        default: IMAGE
      media:
        description: "percorso dentro docs/, per esempio media/come-si-gioca.jpg"
        required: true
      didascalia:
        description: "percorso del testo dentro docs/ (vuoto per le storie)"
        required: false
      trial:
        description: "Prova come Trial Reel (se rifiutato, reel normale)"
        type: boolean
        default: false
      alle:
        description: "Aspetta fino a quest'ora italiana prima di pubblicare (HH:MM, vuoto = subito)"
        required: false

permissions:
  contents: write

concurrency:
  group: pubblica
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      IG_TOKEN: ${{ secrets.IG_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Aspetta l'orario
        if: inputs.alle != ''
        run: |
          target=$(TZ=Europe/Rome date -d "today ${{ inputs.alle }}" +%s); now=$(date +%s)
          if [ "$target" -gt "$now" ]; then echo "aspetto $(( (target-now)/60 )) minuti"; sleep $(( target-now )); fi
      - name: Pubblica su Instagram
        run: |
          ARGS=(--tipo "${{ inputs.tipo }}" --media "${{ inputs.media }}")
          if [ -n "${{ inputs.didascalia }}" ]; then ARGS+=(--didascalia "${{ inputs.didascalia }}"); fi
          if [ "${{ inputs.trial }}" = "true" ]; then ARGS+=(--trial); fi
          python3 -I motore/pubblica.py "${ARGS[@]}"
      - name: Salva il registro
        run: |
          git config user.name "zampe-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add motore/pubblicati.json
          git diff --cached --quiet && exit 0
          git commit -q -m "Registro pubblicazioni"
          git pull -q --rebase && git push -q

# Cancella da Instagram un nostro contenuto (id da motore/pubblicati.json). Solo a mano, su richiesta di Alberto.
name: cancella

on:
  workflow_dispatch:
    inputs:
      id:
        description: "id del contenuto in motore/pubblicati.json"
        required: true

permissions:
  contents: write

jobs:
  cancella:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      IG_TOKEN: ${{ secrets.IG_TOKEN }}
      ID: ${{ inputs.id }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 -I motore/cancella.py "$ID"
      - name: Salva
        run: |
          git config user.name "zampe-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add motore/pubblicati.json
          git diff --cached --quiet && exit 0
          git commit -q -m "Contenuto cancellato su richiesta"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 15; done

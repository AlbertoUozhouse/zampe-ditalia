# Un reel automatico: copione dai dati veri, voce di Chris, video HyperFrames, controlli, pubblicazione.
# Lo avvia la guardia (veglia.yml) agli orari di motore/config.json; si può lanciare anche a mano.
name: reel

on:
  workflow_dispatch:
    inputs:
      formato:
        description: "gara, derby, buio, fondatore, puntata, attivita, altri… oppure auto"
        required: true
        default: auto
      pubblica:
        description: "Pubblica su Instagram (false = solo prova)"
        type: boolean
        default: true
      prova:
        description: "Trial Reel: mostrato prima solo a chi non ci segue"
        type: boolean
        default: false
      riserva:
        description: "È già il reel di riserva di uno fallito (non ne lancia un altro)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: reel
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IG_TOKEN: ${{ secrets.IG_TOKEN }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}  # il Direttore video (motore/agenzia.py); senza, i reel escono come prima
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Strumenti
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji >/dev/null
          pip install -q numpy pillow  # pillow: la copertina con la mappa vera (reel/copertina.py, 7/11)
      - name: Copione
        id: copione
        if: ${{ !startsWith(inputs.formato, 'pronto-') }}
        run: |
          # 78 = il reel salta (test di crescita: nessun caso verificato, o alle 21 nessuna storia con un motivo per uscire): si registra il motivo, non è un errore
          set +e; python3 motore/copione.py "${{ inputs.formato }}" /tmp/copione.json; e=$?; set -e
          if [ "$e" = 78 ]; then echo "salta=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          [ "$e" = 0 ] || exit "$e"
          # Centro Agenzia: prima del montaggio il Direttore video sceglie apertura, inquadratura e momento della luce (nel test: Mappa e dati verifica il caso)
          set +e; python3 -I motore/agenzia.py prima /tmp/copione.json; a=$?; set -e
          if [ "$a" = 78 ]; then echo "salta=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          [ "$a" = 0 ] || echo "Direttore video non raggiungibile: si monta col copione"
      - name: Video e revisione del Direttore
        if: ${{ !startsWith(inputs.formato, 'pronto-') && steps.copione.outputs.salta != '1' }}
        run: |
          # al massimo 2 revisioni: approvato = si pubblica; corretto = si rimonta e si rimanda; difetti dopo 2 giri = bozza e reel di riserva
          for giro in 1 2; do
            rm -rf /tmp/reel; python3 reel/costruisci.py /tmp/copione.json /tmp/reel
            set +e; python3 -I motore/agenzia.py revisione /tmp/copione.json /tmp/reel $giro; esito=$?; set -e
            [ "$esito" = 0 ] && exit 0
            [ "$esito" = 10 ] && [ "$giro" = 1 ] && continue
            ID=$(python3 -c "import json;print(json.load(open('/tmp/copione.json'))['id'])")
            mkdir -p docs/media/bozze; cp /tmp/reel/reel.mp4 "docs/media/bozze/$ID.mp4"
            git config user.name "zampe-bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            for d in docs/media/bozze docs/data/agenzia docs/agenzia; do [ -e "$d" ] && git add "$d"; done; git commit -q -m "Reel in bozza (il Direttore video non l'ha approvato) $ID"
            for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 15; done
            echo "reel in bozza: parte il reel di riserva"; exit 1
          done
      - name: Reel già montato
        if: ${{ startsWith(inputs.formato, 'pronto-') }}
        run: F="${{ inputs.formato }}"; python3 reel/pronto.py "${F#pronto-}" /tmp/copione.json /tmp/reel
      - name: Verifica di Mappa e dati
        id: verifica
        if: ${{ !startsWith(inputs.formato, 'pronto-') && steps.copione.outputs.salta != '1' }}
        run: |
          # il caso raccontato è ancora vero adesso, dopo il montaggio? (il paese ancora al buio, la sfida e il punteggio uguali) Se no, il reel si ferma
          set +e; python3 motore/copione.py verifica /tmp/copione.json; e=$?; set -e
          if [ "$e" = 78 ]; then echo "salta=1" >> "$GITHUB_OUTPUT"; fi
      - name: Registra il reel saltato
        if: ${{ steps.copione.outputs.salta == '1' || steps.verifica.outputs.salta == '1' }}
        run: |
          git config user.name "zampe-bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add motore/reel_fatti.json; for d in docs/data/agenzia docs/agenzia; do [ -e "$d" ] && git add "$d"; done
          git diff --cached --quiet || git commit -q -m "Reel saltato: nessun caso verificato (${{ inputs.formato }})"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 15; done
      - name: Carica sul sito
        id: carica
        if: ${{ steps.copione.outputs.salta != '1' && steps.verifica.outputs.salta != '1' }}
        run: |
          ID=$(python3 -c "import json;print(json.load(open('/tmp/copione.json'))['id'])")
          mkdir -p docs/media/auto docs/contenuti/auto docs/media/bozze/anteprime
          if [ "${{ inputs.pubblica }}" != "true" ]; then
            # anteprima (pubblica = false): il video va tra le bozze, il copione non consuma i casi del test, niente attesa del sito
            cp /tmp/reel/reel.mp4 "docs/media/bozze/anteprime/$ID.mp4"; cp /tmp/copione.json "docs/media/bozze/anteprime/$ID.json"; cp /tmp/reel/didascalia.txt "docs/media/bozze/anteprime/$ID.txt"
            python3 reel/copertina.py /tmp/copione.json "docs/media/bozze/anteprime/$ID.jpg" || true
            git checkout motore/reel_fatti.json
            git config user.name "zampe-bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/media/bozze/anteprime; for d in docs/data/agenzia docs/agenzia; do [ -e "$d" ] && git add "$d"; done
            git commit -q -m "Anteprima $ID (non pubblicata)"
            for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 15; done
            echo "id=$ID" >> "$GITHUB_OUTPUT"; exit 0
          fi
          cp /tmp/reel/reel.mp4 "docs/media/auto/$ID.mp4"
          cp /tmp/reel/didascalia.txt "docs/contenuti/auto/$ID.txt"
          python3 reel/copertina.py /tmp/copione.json "docs/media/auto/$ID.jpg" || echo "copertina non creata: si usa il primo fotogramma"
          # sul sito restano solo i reel degli ultimi 3 giorni
          # (7/11: con -mtime non si cancellava niente, perché la copia appena scaricata ha tutti i file «nuovi»: si usa la data nel nome)
          LIMITE=$(date -u -d '3 days ago' +%Y-%m-%d)
          for f in docs/media/auto/*; do n=$(basename "$f"); if [ "${n:0:10}" \< "$LIMITE" ]; then rm -f "$f"; fi; done
          git config user.name "zampe-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          LIMITE2=$(date -u -d '14 days ago' +%Y-%m-%d)  # fotogrammi della stanza e bozze: due settimane
          for f in docs/agenzia/fotogrammi/* docs/media/bozze/*; do [ -e "$f" ] || continue; n=$(basename "$f"); if [ "${n:0:10}" \< "$LIMITE2" ]; then rm -rf "$f"; fi; done
          cp /tmp/copione.json "docs/contenuti/auto/$ID.json"  # il copione resta: serve per rivedere e rimontare un reel già uscito
          git add docs/media/auto docs/contenuti/auto motore/reel_fatti.json
          for d in docs/data/agenzia docs/agenzia; do [ -e "$d" ] && git add "$d"; done
          git commit -q -m "Reel automatico $ID"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 15; done
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          # Pages a volte ci mette più di 10 minuti (ieri 2 reel su 3 persi per questo): si aspetta fino a 20
          for i in $(seq 1 80); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' "https://zampeditalia.it/media/auto/$ID.mp4")" = "200" ] && exit 0
            sleep 15
          done
          echo "il video non è comparso sul sito"; exit 1
      - name: Pubblica su Instagram
        if: ${{ inputs.pubblica && steps.copione.outputs.salta != '1' && steps.verifica.outputs.salta != '1' }}
        run: |
          TAG=$(python3 -c "import json;print(','.join(json.load(open('/tmp/copione.json')).get('tag', [])))")
          python3 -I motore/pubblica.py --tipo REELS --media "media/auto/${{ steps.carica.outputs.id }}.mp4" --didascalia "contenuti/auto/${{ steps.carica.outputs.id }}.txt" --tag "$TAG" \
            $( [ -f "docs/media/auto/${{ steps.carica.outputs.id }}.jpg" ] && echo --copertina "media/auto/${{ steps.carica.outputs.id }}.jpg" ) \
            ${{ inputs.prova && '--trial' || '' }}
      - name: Salva il registro
        if: ${{ inputs.pubblica && steps.copione.outputs.salta != '1' && steps.verifica.outputs.salta != '1' }}
        run: |
          git add motore/pubblicati.json
          git diff --cached --quiet && exit 0
          git commit -q -m "Registro pubblicazioni"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 15; done
      - name: Reel di riserva
        if: failure() && inputs.pubblica && !inputs.riserva
        # un reel fallito non lascia il buco: parte un Fondatore (diverso da tutti gli altri), ma solo se nelle ultime 2 ore non è uscito niente
        run: |
          python3 -I motore/orari.py --poco-fa 120 && { echo "è uscito un reel da poco: niente riserva"; exit 0; }
          for t in 1 2 3; do gh workflow run reel.yml -f formato=fondatore -f riserva=true && break; sleep 20; done
      - name: Avvisa Alberto se qualcosa va storto
        if: failure()
        run: |
          gh issue create --title "🔴 Reel automatico non pubblicato (${{ inputs.formato }})" \
            --body "Cosa è successo: il reel automatico si è fermato prima della pubblicazione.
          Cosa fare: niente. Al posto suo è partito un reel di riserva (Fondatore), se non ne era uscito uno da poco; l'agente sistema la causa alla prossima sessione.
          Tempo: 0 minuti.
          Dettagli: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
